[project]
name = "challenge-6-dept-of-snow"
version = "0.1.0"
description = "Alaska Department of Snow field operations agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[mcp]>=2.14.0",
    "mcp>=1.24,<2",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-agentplatform[agent-engines]>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ads_field_ops"]
