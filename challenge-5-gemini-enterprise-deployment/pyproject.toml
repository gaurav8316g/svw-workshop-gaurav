[project]
name = "challenge-5-gemini-enterprise-deployment"
version = "0.1.0"
description = "Harbor Bites customer service agent for Agent Platform and Gemini Enterprise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.14.0",
    "google-cloud-agentplatform[agent-engines]>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_support"]
