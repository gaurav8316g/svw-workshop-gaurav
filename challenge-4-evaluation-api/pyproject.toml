[project]
name = "challenge-4-evaluation-api"
version = "0.1.0"
description = "Harbor Bites customer-service agent and policy evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
eval = [
    "google-adk[eval]>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_support_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
