[project]
name = "challenge-2-rag-and-search"
version = "0.1.0"
description = "Harbor Bites helpdesk using a Discovery Engine handbook and Google Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.14.0",
    "google-cloud-discoveryengine>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_helpdesk"]
