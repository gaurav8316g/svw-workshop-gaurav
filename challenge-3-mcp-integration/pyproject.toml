[project]
name = "challenge-3-mcp"
version = "0.1.0"
description = "Harbor Bites dispatcher using a custom MCP server and Google Maps MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[mcp]>=2.14.0",
    "mcp>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_dispatcher"]
